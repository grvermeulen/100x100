<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100x100 Swim Counter</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --text: #f3f4f6;
      --muted: #cbd5e1;
      --accent: #22d3ee;
      --success: #4ade80;
      --warn: #fbbf24;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #020617 0%, var(--bg) 55%);
      color: var(--text);
    }

    .app {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 16px 14px 28px;
    }

    .header {
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      line-height: 1.2;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .summary {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .summary-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .summary-top strong {
      font-size: 1.2rem;
    }

    .summary-top span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .bar {
      width: 100%;
      height: 12px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8 0%, var(--accent) 55%, #34d399 100%);
      transition: width 220ms ease;
    }

    .remaining {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .people {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .person {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 14px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .person-name {
      margin: 0 0 4px;
      font-size: 1.05rem;
    }

    .person-stats {
      margin: 0;
      font-size: 0.94rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      min-width: 52px;
      min-height: 46px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #08111c;
      background: var(--accent);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
    }

    button.minus {
      background: #93c5fd;
    }

    button.reset {
      margin-top: 14px;
      width: 100%;
      min-height: 44px;
      font-size: 1rem;
      font-weight: 600;
      color: #f8fafc;
      background: #475569;
    }

    .toast-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
    }

    .toast {
      width: min(94%, 560px);
      padding: 12px 14px;
      border-radius: 12px;
      color: #0b1220;
      background: var(--success);
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transform: translateY(12px);
      opacity: 0;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.warn {
      background: var(--warn);
    }

    .toast.done {
      background: var(--success);
    }

    @media (min-width: 640px) {
      .app {
        padding-top: 24px;
      }
      h1 {
        font-size: 1.55rem;
      }
      .person {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>100x100 Lap Counter</h1>
      <p class="sub">Count each 100m lap. Team target: <strong>10,000m</strong>.</p>
    </header>

    <section class="summary">
      <div class="summary-top">
        <strong id="totalMeters">0m / 10,000m</strong>
        <span id="totalLaps">0 laps</span>
      </div>
      <div class="bar">
        <div class="bar-fill" id="progressFill"></div>
      </div>
      <p class="remaining" id="remainingText">10,000m to go.</p>
    </section>

    <section class="people" id="peopleList"></section>

    <button class="reset" id="resetButton" type="button">Reset all counts</button>
  </main>

  <div class="toast-wrap" aria-live="polite">
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const DISTANCE_PER_LAP = 100;
    const TARGET_METERS = 10000;
    const STORAGE_KEY = "swim-100x100-v1";
    const PEOPLE = ["Carlijn", "Guido", "Rik", "Saskia", "Wouter"];
    const MILESTONES = [1000, 2500, 5000, 7500, 10000];

    const state = {
      lapsByPerson: {},
      reachedMilestones: []
    };

    const peopleList = document.getElementById("peopleList");
    const totalMetersEl = document.getElementById("totalMeters");
    const totalLapsEl = document.getElementById("totalLaps");
    const progressFillEl = document.getElementById("progressFill");
    const remainingTextEl = document.getElementById("remainingText");
    const resetButton = document.getElementById("resetButton");
    const toastEl = document.getElementById("toast");

    let toastTimer = null;

    function formatMeters(value) {
      return `${value.toLocaleString()}m`;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        PEOPLE.forEach((name) => (state.lapsByPerson[name] = 0));
        state.reachedMilestones = [];
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        PEOPLE.forEach((name) => {
          const value = parsed?.lapsByPerson?.[name];
          state.lapsByPerson[name] = Number.isInteger(value) && value >= 0 ? value : 0;
        });
        state.reachedMilestones = Array.isArray(parsed?.reachedMilestones)
          ? parsed.reachedMilestones.filter((m) => MILESTONES.includes(m))
          : [];
      } catch {
        PEOPLE.forEach((name) => (state.lapsByPerson[name] = 0));
        state.reachedMilestones = [];
      }
    }

    function getTotals() {
      const totalLaps = PEOPLE.reduce((sum, name) => sum + state.lapsByPerson[name], 0);
      const totalMeters = totalLaps * DISTANCE_PER_LAP;
      return { totalLaps, totalMeters };
    }

    function showToast(text, type = "done") {
      toastEl.textContent = text;
      toastEl.className = `toast show ${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.className = "toast";
      }, 2400);
    }

    function checkMilestones(totalMeters) {
      for (const milestone of MILESTONES) {
        if (totalMeters >= milestone && !state.reachedMilestones.includes(milestone)) {
          state.reachedMilestones.push(milestone);
          if (milestone === TARGET_METERS) {
            showToast("Amazing! Team target reached: 10,000m!", "done");
          } else {
            showToast(`Great job! ${formatMeters(milestone)} reached!`, "warn");
          }
        }
      }
    }

    function updateSummary() {
      const { totalLaps, totalMeters } = getTotals();
      const cappedMeters = Math.min(totalMeters, TARGET_METERS);
      const percent = (cappedMeters / TARGET_METERS) * 100;
      const remaining = Math.max(0, TARGET_METERS - totalMeters);

      totalMetersEl.textContent = `${formatMeters(totalMeters)} / ${formatMeters(TARGET_METERS)}`;
      totalLapsEl.textContent = `${totalLaps} laps`;
      progressFillEl.style.width = `${percent}%`;

      if (remaining > 0) {
        remainingTextEl.textContent = `${formatMeters(remaining)} to go.`;
      } else {
        remainingTextEl.textContent = "Target done. Keep going for extra meters!";
      }

      checkMilestones(totalMeters);
    }

    function renderPeople() {
      peopleList.innerHTML = "";
      for (const name of PEOPLE) {
        const laps = state.lapsByPerson[name];
        const meters = laps * DISTANCE_PER_LAP;

        const card = document.createElement("article");
        card.className = "person";

        const info = document.createElement("div");
        const title = document.createElement("h2");
        title.className = "person-name";
        title.textContent = name;
        const stats = document.createElement("p");
        stats.className = "person-stats";
        stats.textContent = `${laps} laps (${formatMeters(meters)})`;
        info.append(title, stats);

        const actions = document.createElement("div");
        actions.className = "actions";

        const minusBtn = document.createElement("button");
        minusBtn.type = "button";
        minusBtn.className = "minus";
        minusBtn.setAttribute("aria-label", `Decrease laps for ${name}`);
        minusBtn.textContent = "-";
        minusBtn.addEventListener("click", () => {
          state.lapsByPerson[name] = Math.max(0, state.lapsByPerson[name] - 1);
          saveState();
          renderPeople();
          updateSummary();
        });

        const plusBtn = document.createElement("button");
        plusBtn.type = "button";
        plusBtn.setAttribute("aria-label", `Increase laps for ${name}`);
        plusBtn.textContent = "+";
        plusBtn.addEventListener("click", () => {
          state.lapsByPerson[name] += 1;
          saveState();
          renderPeople();
          updateSummary();
        });

        actions.append(minusBtn, plusBtn);
        card.append(info, actions);
        peopleList.append(card);
      }
    }

    resetButton.addEventListener("click", () => {
      PEOPLE.forEach((name) => (state.lapsByPerson[name] = 0));
      state.reachedMilestones = [];
      saveState();
      renderPeople();
      updateSummary();
      showToast("All counts reset.", "warn");
    });

    loadState();
    renderPeople();
    updateSummary();
  </script>
</body>
</html>
